<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow-forslag (prototype)</title>
<style>
:root{
  --page:#ffffff; --surface:#ffffff; --ink:#1d2433; --ink2:#4b5566; --muted:#7b8494; --grid:#e6e8ec; --axis:#c9cdd6; --wash:#f3f4f6; --menu:#F0F1F3;
  --accent:#1f6fd1; --accent-dark:#1859a9; --accent-wash:#e8f1fc; --top:#14213d; --top-ink:#f2f4f8; --border:#dfe2e8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--top);color:var(--top-ink)}
.topr{display:flex;gap:16px;align-items:center;font-size:13px}
.topr .agr{color:#a8b1c4}
.adm{border:1px solid #6b7a99;border-radius:4px;padding:0 7px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#d6dcea}
.top select{background:#22345a;color:#f2f4f8;border:1px solid #4a5b82;border-radius:6px;padding:5px 8px}
.layout{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 52px)}
nav.side{background:var(--menu);border-right:1px solid #D5D8DE;padding:0 0 8px}
nav.side{font-family:Arial,Helvetica,sans-serif;font-size:14px}
nav.side .grp,nav.side a.it{height:36px;margin:8px 8px 0;border-radius:6px;display:flex;align-items:center}
nav.side .grp{gap:6px;padding:0 8px 0 6px;font-weight:700;color:#000;cursor:pointer;user-select:none}
nav.side .grp:hover,nav.side a.it:hover{background:#E8E8E8}
nav.side .grp .ar{width:14px;color:#000;font-size:12px;line-height:1;text-align:center}
nav.side .grp .tag{margin-left:auto}
nav.side a.it{white-space:nowrap;justify-content:space-between;gap:8px;padding:0 8px 0 36px;font-weight:400;color:#1A1A1A;cursor:pointer}
nav.side a.it.on,nav.side a.it.on:hover{background:#E0E0E0;color:#1A1A1A}
nav.side .tags{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
nav.side .tag,nav.side .badge{display:inline-block;background:#2D4A8A;color:#fff;border:0;border-radius:999px;font-size:11px;line-height:16px;font-weight:700;padding:0 7px}
.crumb{font-size:14.5px;color:var(--muted);margin:0 0 6px}
.crumb .sep{margin:0 6px}
.crumb .last{color:var(--ink2)}
.tag{border:1px solid var(--accent);color:var(--accent);border-radius:4px;font-size:10.5px;padding:0 5px;font-weight:600;background:#fff}
.tag.src{white-space:nowrap}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
main{padding:26px 32px 70px;max-width:1240px;width:100%}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;margin:28px 0 8px;font-weight:600}
.sub{color:var(--ink2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpi .v{font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--ink2);font-size:13px;margin-top:4px}
.kpi .n{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.tools label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.tools select,.tools input[type=search]{border:1px solid var(--axis);background:#fff;border-radius:4px;padding:6px 10px;min-width:140px}
.tools .chk{display:flex;gap:6px;align-items:center;padding-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button+button{border-left:1px solid var(--axis)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover{background:#f7f9fc}
tr.dim td{color:var(--muted)}
tr.gh td{background:var(--wash);font-weight:600}
tr.detail>td{background:#f7f9fc;padding:16px 20px}
.pill{display:inline-block;border:1px solid var(--axis);border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap;color:var(--ink2);background:#fff}
.pill.low{border-color:var(--accent);color:var(--accent);font-weight:600}
.pill.medium{background:var(--wash);color:var(--ink);font-weight:600;border-style:dashed}
.pill.not_suggested{color:var(--muted)}
.pill.state{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.kind{border-radius:4px}
.chips button{border:1px solid var(--axis);background:#fff;border-radius:999px;padding:4px 12px;margin-right:6px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;padding:7px 14px;font-weight:600}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-wash)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{background:#fff;color:#b3261e;border-color:#b3261e}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nudge{border-left:4px solid var(--accent);background:var(--accent-wash);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.exception{border-left:4px solid var(--ink);background:#fafbfc}
.nudgeHead{display:block;font-size:20px;font-weight:700;line-height:1.25;margin-bottom:4px}
#nudgeTime{cursor:help;white-space:nowrap}
#topTime{cursor:help}
.exBox{margin-top:12px}
.exRow{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.exRow select,.exRow input{border:1px solid var(--axis);background:#fff;border-radius:4px;padding:4px 8px;font:inherit}
.exRow .exP{width:220px}.exRow .exA{width:180px}.exRow .exV{width:90px;text-align:right}
.exVal{width:300px;display:flex;align-items:center;gap:6px}
.exX{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:4px}
.exX:hover{background:var(--wash);color:var(--ink)}
.exLine{margin-top:6px;font-size:13px;color:var(--ink2)}
.exBad{color:#b3261e;margin-left:8px}
.chSum{background:var(--accent-wash);border-radius:4px;padding:6px 10px;margin:0 0 10px}
.tabsNote{margin-left:auto;align-self:center}
.devScope{margin-bottom:8px}.devScope button{padding:3px 10px;font-size:12px}
.nw{white-space:nowrap}
.muted{color:var(--muted)} .sec{color:var(--ink2)}
.cl{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 10px;font-size:12.5px;color:var(--ink2)}
.cl label{display:inline-flex;gap:4px;align-items:center}
.cl .mine{color:var(--ink);font-weight:700}
code{background:#fff;border:1px solid var(--grid);padding:1px 5px;border-radius:4px;font-size:12.5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;z-index:50;display:none;max-width:260px}
svg text{font-family:inherit}
.flash{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;max-width:380px;z-index:40}
.undo{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 32px;display:flex;gap:16px;align-items:center}
.undo .btn{background:#fff;color:var(--ink);border-color:#fff;padding:3px 12px}
.note{font-size:12px;color:var(--muted)}
.def{font-size:12px;color:var(--muted);margin-top:4px}
.simtag{display:inline-block;border:1px dashed var(--ink);border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle}
.fbwrap{position:fixed;inset:0;background:rgba(15,30,50,.35);z-index:60;display:flex;align-items:center;justify-content:center}
.fbbox{background:#fff;border-radius:8px;padding:18px 20px;width:min(420px,92vw);box-shadow:0 8px 28px rgba(0,0,0,.25)}
.fbbox label.r{display:block;margin:6px 0}
.fbbox input[type=text]{width:100%;margin:4px 0 12px;padding:6px 8px;border:1px solid var(--axis);border-radius:4px}
.dueCards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.dueCards .v{font-size:32px;font-weight:600;line-height:1.1}
.dueCards .l{color:var(--ink2);font-size:13.5px;font-weight:600;margin-bottom:4px}
.ctl{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:0 0 12px}
.ctl .inl{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.ctl select,.ctl input[type=search]{border:1px solid var(--axis);background:#fff;border-radius:4px;padding:6px 10px}
.ctl input[type=search]{margin-left:auto;min-width:200px}
.tabbox{display:inline-flex;gap:2px;background:#E9EBEF;border-radius:6px;padding:3px}
.tabbox button{border:0;background:transparent;border-radius:4px;padding:5px 12px;color:var(--ink2);font-weight:600}
.tabbox button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.18)}
.tabbox .n{font-weight:400;margin-left:3px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sl{flex:none;display:block;width:34px;height:18px;border-radius:9px;background:var(--axis);position:relative}
.switch .sl::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl::after{left:18px}
.switch input:focus-visible+.sl{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{padding:6px 8px;line-height:0}
.ico{flex:none;vertical-align:-3px;margin-right:6px}
.nudge .ico{margin:2px 10px 0 0}
.topCards{grid-template-columns:1.4fr 1fr 1fr}
.topCards .l{margin:4px 0 0}
.topLine{margin:0 0 16px}
.nudge{align-items:center}.nudgeL{flex:1 1 420px;min-width:0}.nudge>div:last-child{flex:none}
.tsRow{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.tsBig{flex:none;min-width:200px}.tsBig .v{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0}.tsBig .v .who{font-size:16px;font-weight:600}.tsBig .n{color:var(--muted);font-size:12.5px}
.tsBar{flex:1 1 200px;min-width:160px}.tsBar .n{font-size:12.5px;color:var(--ink2);text-align:center;margin-bottom:4px}
.tsBar .track{height:14px;border-radius:7px;background:#e3e7ee;overflow:hidden}.tsBar .fill{height:100%;background:var(--accent);border-radius:7px}
a.lnk{color:var(--accent);cursor:pointer;font-weight:600}a.lnk:hover{text-decoration:underline}
.sugg{display:block;margin-top:10px;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:16px}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:6px 14px;border-radius:6px 6px 0 0;color:var(--ink2);font-weight:600}
.tabs button[aria-pressed="true"]{background:#fff;border-color:var(--border);color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.bt{width:100%;font-size:12.5px;background:#fff}
.bt td.dev{background:#fdecea;color:#8a1c14;font-weight:700;border-left:3px solid #b3261e}
.bt td.same{color:var(--muted)}
.pill.dv{border-color:#b3261e;color:#b3261e;font-weight:600;margin-left:4px}
.xnote{display:inline-block;font-size:11px;border:1px dashed var(--axis);border-radius:4px;padding:0 6px;color:var(--muted);margin-left:8px;font-weight:400;vertical-align:middle}
.below{font-weight:700;text-decoration:underline}
.subline{display:block;color:var(--muted);font-size:12px}
.acts{white-space:nowrap}
.riskWhy{display:block;font-size:11.5px;line-height:1.3;color:var(--ink2);margin-top:4px;min-width:170px;max-width:230px}
.riskPanel{margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.riskPanel .riskWhy{display:inline;margin:0;max-width:none;font-size:13px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.side{border-right:0;border-bottom:1px solid var(--border)}main{padding:16px}.g2{grid-template-columns:1fr}.topCards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div></div><div class="topr"><b>Nordkyst Regnskab</b><span class="agr" id="agr"></span><span class="adm">Admin</span><select id="bkSel" aria-label="Bogholder"></select></div></div>
<div id="undo"></div><div id="fb"></div>
<div class="layout"><nav class="side" id="side"></nav><main id="main"></main></div>
<div class="tip" id="tip"></div><div id="flash"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script id="btdata" type="application/json">/*BT*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const nf = (n, d=0) => Number(n).toLocaleString('da-DK', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (x, d=1) => nf(x*100, d) + ' %';
const kr = (x, d=2) => nf(x, d) + ' kr.';
const fdate = iso => iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(2,4);
const ftime = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const vatL = v => v==='NONE' ? 'Ingen moms' : v;
const MON = ['nov 25','dec 25','jan 26','feb 26','mar 26','apr 26','maj 26','jun 26','jul 26','aug 26','sep 26','okt 26'];
const TODAY = '29.10.26';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = D.patterns, byId = Object.fromEntries(P.map(p=>[p.pattern_id,p]));
const EXC = D.value.exception, BKS = Object.keys(D.praksis);
const cname = c => D.clientName[c], cfull = c => `${D.clientName[c]} (${c})`, bkl = b => `${D.bkName[b]} (${b})`;
const S = {page:'tasks', bk:'B2', level:'mid', model:'equal', open:null, showAll:false, risk:'all', type:'all', q:'', sort:'safety',
           rules:[], ruleSeq:1, dismissed:new Set(), heldClients:new Set([EXC.client]), choosing:null, confirmDel:null, undo:null, fb:null, feedback:[], tab:'mine', btAll:false, suggestColl:false, suggested:{},
           menu:{admin:true, central:false, praksis:true, defaults:false, automation:true},
           drafts:{}, ruleEdit:null, devScope:'all', group:'none', taskTab:'open', myOnly:true, tq:'', ttype:'all', filtersOpen:false, period:'this', nudgeHidden:false};
D.value.approved.forEach(a => S.rules.push({id:'R'+(S.ruleSeq++), pid:a.pattern_id, clients:[...byId[a.pattern_id].clients], created:'02.05.26', batch:'init', initial:true, exc:[]}));
const excRule = () => S.rules.find(r=>r.pid===EXC.pattern);
if(excRule()) Object.assign(excRule(), {payee:EXC.usual_to, amount:EXC.usual_amount, sentToJournal:false});
const MODEL_LABEL = {equal:'Touch cost equal', split:'Suggestion cheaper'}, LEVEL_LABEL = {low:'Low', mid:'Mid', high:'High'};
const RISK_DA = {low:'Lav risiko', medium:'Mellem risiko', not_suggested:'Ikke foreslået'}, RISK_ORD = {low:0, medium:1, not_suggested:2};
const mm = x => nf(x, Number.isInteger(x)?0:(x*10%1===0?1:2));
const mins = () => D.minutes[S.model][S.level];

const hoursOf = h => (h.suggestion_accepted*mins().suggestion_accepted + h.rule_to_journal*mins().rule_to_journal + h.manual*mins().manual)/60;

/* ---------- rules and state ---------- */
const rulesFor = pid => S.rules.filter(r=>r.pid===pid);
const pausedOf = r => r.paused||(r.paused=new Set());
const rAllPaused = r => r.clients.every(c=>pausedOf(r).has(c));
const ownClients = r => r.clients.filter(isMine);
const ownPaused = r => { const o=ownClients(r); return o.length>0 && o.every(c=>pausedOf(r).has(c)); };
const ruleEff = r => r.clients.filter(c=>!pausedOf(r).has(c) && !(r.pid===EXC.pattern && S.heldClients.has(c)));
const effSet = p => new Set(rulesFor(p.pattern_id).flatMap(ruleEff));
const hasHold = () => S.heldClients.size>0 && !!excRule();
const stateOf = p => {
  if(S.dismissed.has(p.pattern_id)) return 'dismissed';
  const rs=rulesFor(p.pattern_id);
  if(!rs.length) return p.status==='suggested' ? 'open' : 'not_suggested';
  if(p.pattern_id===EXC.pattern && hasHold() && rs.some(r=>!rAllPaused(r))) return 'held';
  const n=effSet(p).size;
  if(n===0) return unappr(p).length?'partial':'paused';
  return n>=p.n_clients ? 'approved' : 'partial';
};
const isOpen = p => p.status==='suggested' && ['open','partial'].includes(stateOf(p));
const myOpen = p => unappr(p).filter(isMine);
const colleagues = p => unappr(p).filter(c=>!isMine(c));
const unappr = p => { const e=effSet(p); const all=new Set(rulesFor(p.pattern_id).flatMap(r=>r.clients)); return p.clients.filter(c=>!all.has(c) || (!e.has(c) && false)); };
const sv = (p,c) => p.saved_by_client[c]||0;
const savedFor = (p, cs) => cs.reduce((s,c)=>s+sv(p,c),0);
const hoursPer = p => p.saved_per_month ? hoursOf(p.saved_by_handling)/p.saved_per_month : 0;
const isMine = c => D.clientBk[c]===S.bk;
const mine = p => p.clients.filter(isMine);
const mySaved = p => savedFor(p, unappr(p).filter(isMine));
const sortSafe = (a,b) => RISK_ORD[a.risk]-RISK_ORD[b.risk] || a.safety_rank-b.safety_rank;
const openMine = () => P.filter(p=>isOpen(p) && p.type!=='rent' && mySaved(p)>0);
const rentPats = () => P.filter(p=>p.type==='rent' && isMine(p.clients[0]) && p.status==='suggested' && !S.dismissed.has(p.pattern_id));
const openRentMine = () => rentPats().filter(isOpen);
const activeRules = () => S.rules.filter(r=>S.rules.includes(r));
const activePats = () => P.filter(p=>['approved','partial','paused','held'].includes(stateOf(p)));
const liveSaved = (only) => P.reduce((s,p)=>s+savedFor(p,[...effSet(p)].filter(c=>!only||isMine(c))),0);
const liveHoursOffice = () => P.reduce((s,p)=>s+savedFor(p,[...effSet(p)])*hoursPer(p),0);
const openLow = () => openMine().filter(p=>p.risk==='low').sort(sortSafe);
const riskLine = t => `<span class="riskWhy">${esc(t)}</span>`;
const flash = msg => { const f=$('#flash'); f.innerHTML=`<div class="flash">${esc(msg)}</div>`; clearTimeout(flash.t); flash.t=setTimeout(()=>f.innerHTML='',3500); };

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML=html; tip.style.display='block'; tip.style.left=Math.min(e.clientX+12,innerWidth-280)+'px'; tip.style.top=(e.clientY+12)+'px'; }
function hideTip(){ tip.style.display='none'; }
function wireTips(root){ root.querySelectorAll('[data-tip]').forEach(r=>{ r.addEventListener('mousemove',e=>showTip(e,r.dataset.tip)); r.addEventListener('mouseleave',hideTip); }); }

/* ---------- chart ---------- */
function niceTicks(max){ const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), nm=raw/mag, step=(nm<=1?1:nm<=2?2:nm<=5?5:10)*mag; const top=Math.ceil(max/step-1e-9)*step, ticks=[]; for(let v=0;v<=top+1e-9;v+=step) ticks.push(+v.toFixed(6)); return {ticks,top,step}; }
function barChart(items, o){
  const W=o.w||560,H=o.h||250,m={l:46,r:16,t:18,b:o.bottom||54}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const mx=Math.max(...items.map(i=>i.v))*1.08||1, nt=niceTicks(mx), hi=nt.top, Y=v=>m.t+ih*(1-v/hi), bw=Math.min(54,iw/items.length*0.6);
  let g='';
  nt.ticks.forEach(v=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(v,nt.step<1?1:0)}</text>`; });
  items.forEach((it,i)=>{
    const cx=m.l+iw*(i+.5)/items.length, y=Y(it.v);
    const fill=it.proj?'var(--accent-wash)':(it.hl?'var(--accent)':'var(--axis)'), stroke=it.proj?'var(--accent)':'none';

/* ---------- afvigelsesregler: shared editor for the panel and Bank workflows ---------- */
/* Amounts in the backtest are signed (payments are negative). A limit is about the size of the amount, so every comparison uses the absolute value. */
const EX_PARAM={gt:'Beløb større end',lt:'Beløb mindre end',new:'Ny modtager',vat:'Bilagets momskode afviger'}, EX_ACT={hold:'Hold tilbage',journal:'Send til kassekladde'}, EX_SUG='Forslag ud fra historikken';
const exIsAmt = k => k==='gt'||k==='lt';
const quantile = (a,q) => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), i=(s.length-1)*q, lo=Math.floor(i); return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo); };
const exSuggest = (k,post) => { const v=quantile(post.map(b=>Math.abs(b.amount)),k==='gt'?.95:.05); return v===null?'':Math.round(v); };
const exValid = r => !exIsAmt(r.param)||(!r.edited&&r.value==='')||(r.value!==''&&isFinite(r.value)&&+r.value>=0);

const draftOf = k => S.drafts[exKey(k)]||(S.drafts[exKey(k)]=[]);
const exBadDraft = k => draftOf(k).some(r=>!exValid(r));

const exCount = r => { const n=(r.exc||[]).length; return n?`${n} ${n===1?'afvigelsesregel':'afvigelsesregler'}`:'Ingen afvigelsesregler'; };
const exCtx = key => { if(key==='edit'){ const r=S.rules.find(x=>x.id===S.ruleEdit.rid); return {rows:S.ruleEdit.rows, post:btRows([r.pid]).filter(b=>r.clients.includes(b.client)), chosen:false}; }
  const pids=key==='RENT'?openRentMine().map(p=>p.pattern_id):[key]; return {rows:draftOf(key), post:btRows(pids).filter(b=>!S.choosing||S.choosing.sel.has(b.client)), chosen:!!S.choosing}; };
const exNote = r => r.param==='vat'?'Virker, når bilaget er matchet.':exIsAmt(r.param)?(r.edited?(r.note||''):EX_SUG):'';
function exLineHtml(c){
  const amt=c.rows.filter(r=>exIsAmt(r.param)); if(!amt.length) return '';
  const bad=c.rows.some(r=>!exValid(r))?'<span class="exBad" id="exBad">Udfyld beløbet, eller fjern reglen.</span>':'';
  if(!c.post.length) return `Vælg mindst én kunde for at se tallene.${bad}`;
  const hit=c.post.filter(b=>exHit(c.rows,Math.abs(b.amount))).length, M=c.post.length, acts=new Set(amt.map(r=>r.action));
  const verb=acts.size>1?'holdt tilbage eller sendt til kassekladden':acts.has('journal')?'sendt til kassekladden':'holdt tilbage';
  return `Med disse regler var ${nf(hit)} af ${nf(M)} blevet ${verb} i backtesten${c.chosen?' for de valgte kunder':''} (${nf(hit/M*100,1)} %).${bad}`;
}

  return `<div class="exBox" id="exBox" data-ex="${key}">${c.rows.map((r,i)=>`<div class="exRow" data-i="${i}">

/* ---------- actions ---------- */
function addRule(pid, clients, batch, exc){ S.rules.push({id:'R'+(S.ruleSeq++), pid, clients:[...clients], created:TODAY, batch, exc:exc||[]}); S.dismissed.delete(pid); }
function approve(pids, clientsOf, suggest, key){
  const batch='B'+Date.now()+Math.random(); let n=0;
  const draft=exFreeze(draftOf(key)), kept=draftOf(key), dkey=exKey(key);
  pids.forEach(pid=>{ const cs=clientsOf(byId[pid]); addRule(pid, cs, batch, draft.map(r=>({...r}))); n+=cs.length; if(suggest) S.suggested[pid]={by:S.bk,batch}; });
  S.suggestColl=false;
  setUndo(`Workflowen er godkendt for dine ${n} ${n===1?'kunde':'kunder'}${suggest?', og foreslået til kolleger':''}.`, 'approve', {batch, dkey, kept});
  delete S.drafts[dkey];
}
function doDismiss(pid,isRent){ const pids=isRent?openRentMine().map(p=>p.pattern_id):[pid]; pids.forEach(id=>S.dismissed.add(id)); S.open=null; setUndo('Forslaget er afvist.', 'dismiss', {pids}); }
function doUndo(){ const u=S.undo; if(!u) return; clearTimeout(S.undoTimer);
  if(u.kind==='approve'){ S.rules=S.rules.filter(r=>r.batch!==u.payload.batch); Object.keys(S.suggested).forEach(k=>{ if(S.suggested[k].batch===u.payload.batch) delete S.suggested[k]; }); S.drafts[u.payload.dkey]=u.payload.kept; }
  else if(u.kind==='dismiss') u.payload.pids.forEach(id=>S.dismissed.delete(id));
  S.undo=null; flash('Fortrudt.'); }
function doPause(rid){ const r=S.rules.find(x=>x.id===rid), own=ownClients(r); own.forEach(c=>pausedOf(r).add(c)); flash(`Sat på pause for ${own.length===1?'din 1 kunde':`dine ${own.length} kunder`}.`); }
function resolveHold(change){ const r=excRule(); S.heldClients.clear(); r.paused=new Set(); Object.assign(r,change); }
function doDelete(rid){ const r=S.rules.find(x=>x.id===rid), own=ownClients(r), rest=r.clients.filter(c=>!isMine(c)); S.confirmDel=null;
  own.forEach(c=>pausedOf(r).delete(c));
  if(rest.length) r.clients=rest; else S.rules=S.rules.filter(x=>x.id!==rid);
  if(r.pid===EXC.pattern && own.includes(EXC.client)) S.heldClients.clear();
  flash(rest.length?`Workflowen for ${byId[r.pid].name} er slettet for ${own.length===1?'din 1 kunde':`dine ${own.length} kunder`}. Forslaget er tilbage.`:`Workflowen for ${byId[r.pid].name} er slettet. Forslaget er tilbage.`); }

  const nav=e.target.closest('a[data-page]'); if(nav){ S.page=nav.dataset.page; S.open=null; S.choosing=null; S.confirmDel=null; S.suggestColl=false; S.ruleEdit=null; return render(); }
  const lv=e.target.closest('[data-lvl]'); if(lv){ S.level=lv.dataset.lvl; return render(); }
  const md=e.target.closest('[data-mdl]'); if(md){ S.model=md.dataset.mdl; return render(); }
  const ch=e.target.closest('[data-chip]'); if(ch){ S[ch.dataset.chip]=ch.dataset.v; return render(); }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, pid=a.dataset.pid, rid=a.dataset.rid, isRent=pid==='RENT';
  if(act==='toggle'){ S.open=(S.open===pid)?null:pid; S.choosing=null; S.suggestColl=false; S.tab='mine'; S.btAll=false; S.devScope='all'; return render(); }
  if(act==='exAdd'||act==='exDel'){ const key=a.closest('[data-ex]').dataset.ex, c=exCtx(key);
    if(act==='exDel'){ c.rows.splice(+a.dataset.i,1); return render(); }
    const k=Object.keys(EX_PARAM).find(x=>!c.rows.some(r=>r.param===x)); if(k) c.rows.push({param:k,value:exIsAmt(k)?exSuggest(k,c.post):'',action:'hold',edited:false}); return render(); }

  if(act==='exCancel'){ S.ruleEdit=null; return render(); }
  if(act==='exSave'){ if(S.ruleEdit.rows.some(x=>!exValid(x))) return; S.rules.find(x=>x.id===S.ruleEdit.rid).exc=exFreeze(S.ruleEdit.rows); S.ruleEdit=null; flash('Afvigelsesreglerne er gemt.'); return render(); }
  if(act==='goBk'){ S.bk=a.dataset.bk; S.page='suggestions'; S.showAll=false; S.open=null; S.choosing=null; S.suggestColl=false; return render(); }
  if(act==='btAll'){ S.btAll=!S.btAll; return btRefresh(); }
  if(act==='showAll'){ S.showAll=!S.showAll; S.open=null; S.choosing=null; S.suggestColl=false; return render(); }
  if(act==='taskNew'){ flash('Opret opgave er ikke med i prototypen.'); return; }

  if(act==='filters'){ S.filtersOpen=!S.filtersOpen; return render(); }
  if(act==='nudgeLater'){ S.nudgeHidden=true; flash('Vi minder dig om det senere.'); return render(); }
  if(act==='nudgeGo'){ const c=openMine().sort(sortSafe)[0]; S.page='suggestions'; S.showAll=false; S.open=c?c.pattern_id:null; return render(); }
  if(act==='dismiss'){ S.fb={kind:'dismiss',pid,isRent}; return render(); }
  if(act==='restore'){ S.dismissed.delete(pid); return render(); }
  if(act==='approveAll'){ if(exBadDraft(pid)) return; if(isRent) approve(openRentMine().map(p=>p.pattern_id), p=>p.clients, false, pid); else approve([pid], p=>myOpen(p), S.suggestColl && colleagues(byId[pid]).length>0, pid); S.open=null; return render(); }
  if(act==='choose'){ const cs=isRent?openRentMine().map(p=>p.clients[0]):myOpen(byId[pid]); S.choosing={key:pid,sel:new Set(cs)}; S.btAll=false; return render(); }
  if(act==='cancelChoose'){ S.choosing=null; S.tab='mine'; S.btAll=false; S.devScope='all'; return render(); }
  if(act==='approveSel'){ const sel=S.choosing.sel; if(!sel.size||exBadDraft(pid)) return;
    if(isRent) approve(openRentMine().filter(p=>sel.has(p.clients[0])).map(p=>p.pattern_id), p=>p.clients, false, pid);
    else approve([pid], p=>myOpen(p).filter(c=>sel.has(c)), S.suggestColl && colleagues(byId[pid]).length>0, pid);
    S.choosing=null; S.open=null; return render(); }
  if(act==='undo'){ if(!S.undo) return; clearTimeout(S.undoTimer); S.fb={kind:'undo'}; return render(); }
  if(act==='fbCancel'){ if(S.fb.kind==='undo'&&S.undo){ S.undo.expires=Date.now()+10000; S.undoTimer=setTimeout(()=>{ S.undo=null; render(); },10000); } S.fb=null; return render(); }
  if(act==='fbConfirm'){ const f=S.fb, r=document.querySelector('input[name=fbr]:checked'), t=($('#fbt').value||'').trim();
    const wf = f.kind==='dismiss' ? (f.isRent?'Husleje':byId[f.pid].name) : (f.kind==='delete'||f.kind==='pause') ? byId[S.rules.find(x=>x.id===f.rid).pid].name : S.undo ? S.undo.msg : '';
    S.feedback.push({kind:f.kind, workflow:wf, reason:r?r.value:'Ingen årsag angivet', text:t, at:TODAY});
    S.fb=null;
    if(f.kind==='dismiss') doDismiss(f.pid,f.isRent); else if(f.kind==='undo') doUndo(); else if(f.kind==='pause') doPause(f.rid); else doDelete(f.rid);
    return render(); }
  if(act==='rulePause'){ if(!ownClients(S.rules.find(x=>x.id===rid)).length) return; S.fb={kind:'pause',rid}; return render(); }
  if(act==='ruleResume'){ const r=S.rules.find(x=>x.id===rid); ownClients(r).forEach(c=>pausedOf(r).delete(c)); flash('Workflowen kører igen.'); return render(); }
  if(act==='ruleDelete'){ if(!ownClients(S.rules.find(x=>x.id===rid)).length) return; S.fb={kind:'delete',rid}; return render(); }
  if(act==='excUpdate'){ resolveHold({payee:EXC.new_to, amount:EXC.held_amount, sentToJournal:false}); flash(`Workflowen er opdateret for ${cname(EXC.client)}.`); return render(); }
  if(act==='excBook'){ resolveHold({sentToJournal:true}); flash('Betalingen er sendt til kassekladden. Workflowen er uændret.'); return render(); }
  if(act==='excHold'){ flash('Workflowen er stadig holdt tilbage.'); return render(); }
});
